<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>求职助手连接器</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <h2>连接桌面求职助手</h2>
    <p>在应用“设置与帮助”启动浏览器连接器，复制连接码到这里。只在本机通信。</p>
    <label for="code">连接码</label
    ><input id="code" type="password" autocomplete="off" /><button id="connect">
      连接
    </button>
    <p id="status" role="status"></p>
    <small
      >后台标签页执行仍需要电脑、Chrome
      和桌面应用保持运行。遇到验证或页面变化会暂停。</small
    >
    <script src="popup.js"></script>
  </body>
</html>
